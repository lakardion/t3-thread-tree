name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: test "$GITHUB_REF_NAME" = "v$(jq -r .version package.json)"
      - run: bun install --frozen-lockfile
      - run: bun run desktop:dmg --publish never
      - run: gh release create "$GITHUB_REF_NAME" release/*.dmg --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
